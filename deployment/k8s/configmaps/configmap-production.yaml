apiVersion: v1
kind: ConfigMap
metadata:
  name: whiteboard-config
  namespace: whiteboard-production
  labels:
    app.kubernetes.io/part-of: collaborative-whiteboard
    app.kubernetes.io/environment: production
data:
  NODE_ENV: "production"
  PORT: "1234"
  SOCKET_PORT: "3001"
  WORKER_PORT: "9090"
  LOG_LEVEL: "info"
  MONGODB_URI: "mongodb://whiteboard-mongodb:27017/whiteboard-prod?replicaSet=rs0&ssl=true"
  REDIS_HOST: "whiteboard-redis"
  REDIS_PORT: "6379"
  S3_BUCKET_NAME: "whiteboard-prod-snapshots"
  S3_REGION: "us-east-1"
  CDN_DOMAIN: "https://cdn.whiteboard.local"
