apiVersion: apps/v1
kind: Deployment
metadata:
  name: whiteboard-api
  namespace: whiteboard-production
  labels:
    app: whiteboard-api
    app.kubernetes.io/component: backend-api
    app.kubernetes.io/part-of: collaborative-whiteboard
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: whiteboard-api
  template:
    metadata:
      labels:
        app: whiteboard-api
        app.kubernetes.io/component: backend-api
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - whiteboard-api
                topologyKey: kubernetes.io/hostname
      containers:
        - name: api
          image: ghcr.io/collaborative-whiteboard/api:production-latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 1234
              name: http
          envFrom:
            - configMapRef:
                name: whiteboard-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: whiteboard-secrets
                  key: JWT_SECRET
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 1234
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 1234
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
