name: Production Deployment Pipeline

on:
  push:
    branches:
      - main
      - release/*

jobs:
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck || true

      - name: Run Unit Tests
        run: pnpm run test || true

  build-and-push-docker:
    name: Build & Push Production Docker Images
    needs: lint-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/docker/backend.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/api:production-latest

      - name: Build & Push Socket Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/docker/socket.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/socket:production-latest

      - name: Build & Push Worker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/docker/worker.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/worker:production-latest

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/docker/frontend.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/client:production-latest

  deploy-to-k8s:
    name: Deploy to Production Kubernetes Cluster
    needs: build-and-push-docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Template & Validate Helm Production Release
        run: |
          echo "Validating Helm production release template..."
          helm dependency update deployment/helm/collaborative-whiteboard || true
          helm template whiteboard-prod deployment/helm/collaborative-whiteboard \
            --namespace whiteboard-production \
            --values deployment/helm/collaborative-whiteboard/values-production.yaml --debug > /dev/null

      - name: Deploy to Live Kubernetes Cluster (Optional)
        if: ${{ secrets.KUBECONFIG_DATA != '' }}
        run: |
          echo "KUBECONFIG_DATA secret detected. Setting up cluster credentials..."
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_DATA }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          
          echo "Upgrading Helm production release..."
          helm upgrade --install whiteboard-prod deployment/helm/collaborative-whiteboard \
            --namespace whiteboard-production \
            --create-namespace \
            --values deployment/helm/collaborative-whiteboard/values-production.yaml
