name: Playwright Tests
on:
  push:
    branches: [ main, master, feat/** ]
  pull_request:
    branches: [ main, master, feat/** ]

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright tests
        run: pnpm test:e2e
        env:
          NODE_ENV: test
          JWT_SECRET: mock_jwt_secret_for_e2e_testing_32_chars_long
          MONGO_URL: mongodb+srv://haresahani:L6pnAMuyVnIpFFT3@whiteboard-collab.vtsbfwk.mongodb.net/collaborative-whiteboard?appName=whiteboard-collab
          PORT: 1234
          SOCKET_PORT: 3001

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: tests/e2e/playwright/reports/html/
          retention-days: 30
