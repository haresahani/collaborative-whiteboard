server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API Proxy – VITE_API_URL is baked into the JS bundle at build time.
    # nginx does NOT proxy /api/ at runtime on Render because the browser
    # calls the API URL directly (configured via VITE_API_URL env var).
    # The proxy block below is only used in local Docker Compose where
    # the "api" hostname resolves inside the compose network.
    # On Render this block is intentionally removed to avoid DNS failures.

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
