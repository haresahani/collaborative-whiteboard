version: "3.8"

services:
  mongodb:
    image: mongo:7.0
    container_name: whiteboard-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: whiteboard-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 3s
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: packages/api/Dockerfile
    container_name: whiteboard-api
    ports:
      - "1234:1234"
    env_file:
      - ../env/docker.env
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:1234/api/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  socket:
    build:
      context: ..
      dockerfile: packages/socket/Dockerfile
    container_name: whiteboard-socket
    ports:
      - "3001:3001"
    env_file:
      - ../env/docker.env
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: packages/worker/Dockerfile
    container_name: whiteboard-worker
    ports:
      - "9090:9090"
    env_file:
      - ../env/docker.env
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started
    restart: unless-stopped

  client:
    build:
      context: ..
      dockerfile: packages/client/Dockerfile
    container_name: whiteboard-client
    ports:
      - "8080:80"
    depends_on:
      - api
      - socket
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: whiteboard-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.0
    container_name: whiteboard-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.56
    container_name: whiteboard-jaeger
    ports:
      - "16686:16686" # Jaeger UI
      - "4318:4318" # OTLP HTTP receiver
      - "4317:4317" # OTLP gRPC receiver
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    restart: unless-stopped

volumes:
  mongodb_data:
