global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "api"
    static_configs:
      - targets: ["host.docker.internal:1234"]

  - job_name: "socket"
    static_configs:
      - targets: ["host.docker.internal:3001"]
