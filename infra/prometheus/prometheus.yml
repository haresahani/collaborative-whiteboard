global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "whiteboard-api"
    static_configs:
      - targets: ["api:1234"]

  - job_name: "whiteboard-socket"
    static_configs:
      - targets: ["socket:3001"]

  - job_name: "whiteboard-worker"
    static_configs:
      - targets: ["worker:9090"]
